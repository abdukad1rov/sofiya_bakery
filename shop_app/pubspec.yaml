name: shop_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Database
  http: 1.2.1
  sqflite: ^2.3.3+1
  shared_preferences: ^2.2.3

  # Network
  dio: ^5.4.3+1
  cached_network_image: ^3.3.1
  internet_connection_checker: ^1.0.0+1

  # Maps
  google_maps_flutter: ^2.0.6
  geocoding: ^3.0.0
  geolocator: ^12.0.0

  #State Management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.3
  mask_text_input_formatter: ^2.9.0
  path: ^1.9.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  banner_carousel: ^1.2.1
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  permission_handler: ^12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/
    # - assets/fonts/

